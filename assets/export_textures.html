<!DOCTYPE html>
<html>
<head>
    <title>Export Textures</title>
</head>
<body>
    <h1>Exporting Textures...</h1>
    <script src="../r160.js"></script>
    <script type="module">
        import ProceduralTextureFactory from '../src/aesthetics/ProceduralTextureFactory.js';
        
        async function run() {
            try {
                console.log("Generating assets...");
                ProceduralTextureFactory.USE_STATIC_TEXTURES = false;
                const assets = await ProceduralTextureFactory.generateAssets();
                console.log("Assets generated, exporting...");
                
                const exportQueue = [];
                const metadata = { version: "1.1.5" };
                
                function extractCanvas(item, name, parentKey, index = null) {
                    if (!item) return;
                    
                    if (item.isTexture && item.source && item.source.data && item.source.data instanceof HTMLCanvasElement) {
                        exportQueue.push({name: name, canvas: item.source.data});
                        const texMeta = {
                            type: 'Texture',
                            wrapS: item.wrapS,
                            wrapT: item.wrapT,
                            repeatX: item.repeat ? item.repeat.x : 1,
                            repeatY: item.repeat ? item.repeat.y : 1
                        };
                        if (!metadata[parentKey]) metadata[parentKey] = {};
                        if (index !== null) {
                            if (!metadata[parentKey][index]) metadata[parentKey][index] = texMeta;
                        } else {
                            metadata[parentKey] = texMeta;
                        }
                    } else if (item.isTexture && item.image && item.image instanceof HTMLCanvasElement) {
                        exportQueue.push({name: name, canvas: item.image});
                        const texMeta = {
                            type: 'Texture',
                            wrapS: item.wrapS,
                            wrapT: item.wrapT,
                            repeatX: item.repeat ? item.repeat.x : 1,
                            repeatY: item.repeat ? item.repeat.y : 1
                        };
                        if (!metadata[parentKey]) metadata[parentKey] = {};
                        if (index !== null) {
                            if (!metadata[parentKey][index]) metadata[parentKey][index] = texMeta;
                        } else {
                            metadata[parentKey] = texMeta;
                        }
                    }
                    
                    if (item.isMaterial) {
                        if (item.map) extractCanvas(item.map, name + '_map', parentKey, index);
                        if (item.bumpMap) extractCanvas(item.bumpMap, name + '_bump', parentKey, index);
                        if (item.emissiveMap) extractCanvas(item.emissiveMap, name + '_emissive', parentKey, index);
                        if (item.roughnessMap) extractCanvas(item.roughnessMap, name + '_roughness', parentKey, index);
                        
                        const matMeta = {
                            type: 'Material',
                            color: item.color ? item.color.getHex() : undefined,
                            emissive: item.emissive ? item.emissive.getHex() : undefined,
                            emissiveIntensity: item.emissiveIntensity,
                            roughness: item.roughness,
                            metalness: item.metalness,
                            bumpScale: item.bumpScale,
                            transparent: item.transparent,
                            opacity: item.opacity,
                            shadowSide: item.shadowSide,
                            hasMap: !!item.map,
                            hasBumpMap: !!item.bumpMap,
                            hasEmissiveMap: !!item.emissiveMap,
                            hasRoughnessMap: !!item.roughnessMap,
                            wrapS: item.map ? item.map.wrapS : undefined,
                            wrapT: item.map ? item.map.wrapT : undefined,
                            repeatX: item.map ? item.map.repeat.x : 1,
                            repeatY: item.map ? item.map.repeat.y : 1
                        };
                        
                        if (index !== null) {
                            if (!metadata[parentKey]) metadata[parentKey] = [];
                            metadata[parentKey][index] = matMeta;
                        } else {
                            metadata[parentKey] = matMeta;
                        }
                    }
                }
                
                for (const [key, item] of Object.entries(assets)) {
                    if (Array.isArray(item)) {
                        item.forEach((sub, i) => extractCanvas(sub, `${key}_${i}`, key, i));
                    } else {
                        extractCanvas(item, key, key);
                    }
                }
                
                console.log("Sending metadata...");
                await fetch('http://localhost:8080/export-meta', {
                    method: 'POST',
                    body: JSON.stringify(metadata)
                });
                
                for (const {name, canvas} of exportQueue) {
                    console.log(`Sending ${name}...`);
                    const dataUrl = canvas.toDataURL('image/png');
                    await fetch('http://localhost:8080/export', {
                        method: 'POST',
                        body: JSON.stringify({ name: name, image: dataUrl })
                    });
                }
                
                document.body.innerHTML += '<h2>Done!</h2>';
            } catch (err) {
                console.error(err);
                document.body.innerHTML += '<h2 style="color:red">Error: ' + err.message + '</h2>';
            }
        }
        run();
    </script>
</body>
</html>
